<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 92" width="920" height="92" role="img" aria-label="Production AI Delivery Architecture: Harness to Production">
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .flow {
      fill: none;
      stroke: #2563EB;
      stroke-width: 1.8;
      stroke-dasharray: 4 8;
      animation: move 1.6s linear infinite;
    }
    @keyframes move {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Stage 1 -->
  <rect x="8" y="8" width="206" height="76" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="22" y="28" class="mono" font-size="9.5" font-weight="700" fill="#C2410C" letter-spacing="0.6">01 // CODING HARNESSES</text>
  <text x="22" y="49" class="sans" font-size="12.5" font-weight="700" fill="#0F172A">Claude Code · Codex · Gemini</text>
  <text x="22" y="68" class="mono" font-size="9.8" fill="#64748B">Spec-first agent execution</text>

  <!-- Connector 1 -->
  <line x1="214" y1="46" x2="240" y2="46" stroke="#CBD5E1" stroke-width="1.5"/>
  <line class="flow" x1="214" y1="46" x2="240" y2="46"/>

  <!-- Stage 2 -->
  <rect x="240" y="8" width="206" height="76" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="254" y="28" class="mono" font-size="9.5" font-weight="700" fill="#0284C7" letter-spacing="0.6">02 // ORCHESTRATION &amp; MCP</text>
  <text x="254" y="49" class="sans" font-size="12.5" font-weight="700" fill="#0F172A">Orca · Hermes · OpenClaw</text>
  <text x="254" y="68" class="mono" font-size="9.8" fill="#64748B">Ledger handoffs &amp; verifier veto</text>

  <!-- Connector 2 -->
  <line x1="446" y1="46" x2="472" y2="46" stroke="#CBD5E1" stroke-width="1.5"/>
  <line class="flow" x1="446" y1="46" x2="472" y2="46"/>

  <!-- Stage 3 -->
  <rect x="472" y="8" width="206" height="76" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="486" y="28" class="mono" font-size="9.5" font-weight="700" fill="#0B7A62" letter-spacing="0.6">03 // DISTRIBUTED BACKEND</text>
  <text x="486" y="49" class="sans" font-size="12.5" font-weight="700" fill="#0F172A">NestJS · FastAPI · Kafka</text>
  <text x="486" y="68" class="mono" font-size="9.8" fill="#64748B">GraphQL, Redis &amp; pgvector RAG</text>

  <!-- Connector 3 -->
  <line x1="678" y1="46" x2="704" y2="46" stroke="#CBD5E1" stroke-width="1.5"/>
  <line class="flow" x1="678" y1="46" x2="704" y2="46"/>

  <!-- Stage 4 -->
  <rect x="704" y="8" width="208" height="76" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="718" y="28" class="mono" font-size="9.5" font-weight="700" fill="#2F55C9" letter-spacing="0.6">04 // PRODUCTION RUNTIME</text>
  <text x="718" y="49" class="sans" font-size="12.5" font-weight="700" fill="#0F172A">Keycloak · K8s · Cloudflare</text>
  <text x="718" y="68" class="mono" font-size="9.8" fill="#64748B">SSO/2FA, CI/CD &amp; observability</text>
</svg>
